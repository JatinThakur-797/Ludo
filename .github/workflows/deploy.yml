name: CD — Deploy to Render + Vercel

on:
  push:
    branches: [main]

jobs:
  # ── Deploy Backend on Render ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -f "${{ env.RENDER_DEPLOY_HOOK_URL }}"

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ludo-frontend/package-lock.json

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npm install -g vercel

      - name: Verify Vercel credentials
        id: vercel-config
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping Vercel deployment; missing configuration:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment config
        if: steps.vercel-config.outputs.configured == 'true'
        working-directory: ./ludo-frontend
        run: vercel pull --yes --environment=production

      - name: Build for Vercel
        if: steps.vercel-config.outputs.configured == 'true'
        working-directory: ./ludo-frontend
        run: vercel build --prod

      - name: Deploy to Vercel
        if: steps.vercel-config.outputs.configured == 'true'
        working-directory: ./ludo-frontend
        run: vercel deploy --prebuilt --prod
