name: CD — Deploy to Northflank + Vercel

on:
  push:
    branches: [main]

jobs:
  # ── Build & Push Docker Image to GHCR ────────────────────────────────────
  build-and-push:
    name: Build Docker Image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to GitHub Container Registry

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided by GitHub

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ludo-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./ludo-backend
          file: ./ludo-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Backend on Northflank ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Northflank
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    env:
      # Set NORTHFLANK_PROJECT_ID and NORTHFLANK_SERVICE_ID in:
      # GitHub → Settings → Secrets and variables → Actions → Variables (not secrets)
      PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
      SERVICE_ID: ${{ vars.NORTHFLANK_SERVICE_ID }}
      # NORTHFLANK_CREDENTIALS_ID is the registry credential ID created in Northflank
      # for pulling from GHCR. See setup guide below.
      CREDENTIALS_ID: ${{ vars.NORTHFLANK_CREDENTIALS_ID }}

    steps:
      - name: Deploy image to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ${{ env.PROJECT_ID }}
          service-id: ${{ env.SERVICE_ID }}
          # Pass the full sha-tagged image so Northflank pulls the exact build
          image-path: ghcr.io/${{ github.repository_owner }}/ludo-backend:sha-${{ github.sha }}
          credentials-id: ${{ env.CREDENTIALS_ID }}

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ludo-frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment config
        working-directory: ./ludo-frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        working-directory: ./ludo-frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: ./ludo-frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
