name: CD — Deploy to Northflank + Vercel

on:
  push:
    branches: [main]

jobs:
  # ── Build & Push Docker Image to GHCR ────────────────────────────────────
  build-and-push:
    name: Build Docker Image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to GitHub Container Registry

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ FIX 1: Set up Docker Buildx with docker-container driver
      # Required for GHA cache (type=gha) to work correctly
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ FIX 2: GHCR image paths MUST be all lowercase
      # github.repository_owner can have uppercase letters (e.g. JatinThakur-797)
      # This step converts it to lowercase (e.g. jatinthakur-797)
      - name: Convert owner to lowercase
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lower.outputs.owner }}/ludo-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./ludo-backend
          file: ./ludo-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy Backend on Northflank ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Northflank
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      # Need lowercase owner here too for the image-path
      - name: Convert owner to lowercase
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Deploy image to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_KEY }}
          project-id: ${{ vars.NORTHFLANK_PROJECT_ID }}
          service-id: ${{ vars.NORTHFLANK_SERVICE_ID }}
          # Uses lowercase owner — fixes "Please check your credentials" error
          image-path: ghcr.io/${{ steps.lower.outputs.owner }}/ludo-backend:sha-${{ github.sha }}
          credentials-id: ${{ vars.NORTHFLANK_CREDENTIALS_ID }}

  # ── Deploy Frontend to Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ludo-frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment config
        working-directory: ./ludo-frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        working-directory: ./ludo-frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: ./ludo-frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
