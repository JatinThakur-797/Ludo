# Northflank service configuration for the Spring Boot backend
# Reference: https://northflank.com/docs
#
# ⚠️  This file is DOCUMENTATION only — Northflank does not read YAML from git.
#    The actual service is managed via the Northflank dashboard / API.
#    Use it as a reference when creating / updating the service manually.

service:
  name: ludo-backend
  description: "Spring Boot WebSocket backend for Ludo Multiplayer"

  # ── Image source ──────────────────────────────────────────────────────────
  # The GitHub Actions workflow (deploy.yml) builds the image, pushes it to
  # GHCR, then calls the Northflank API to update the deployment image tag.
  image:
    registry: ghcr.io
    repository: jatinthakur-797/ludo-backend   # ⚠️ MUST be all lowercase — GHCR requirement
    tag: latest                                      # overridden per-deploy by SHA tag

  # ── Resources (Developer Sandbox — free tier) ────────────────────────────
  # Free tier: 0.2 vCPU · 512 MB RAM
  # Upgrade in the dashboard: Project → Service → Settings → Resources
  resources:
    cpu: 0.2      # vCPU
    memory: 512   # MB

  # ── Networking ────────────────────────────────────────────────────────────
  ports:
    - name: http
      internalPort: 8080
      protocol: HTTP   # Northflank auto-generates a public HTTPS URL

  # ── Health check ─────────────────────────────────────────────────────────
  healthcheck:
    path: /api/v1/auth/health
    port: 8080
    protocol: HTTP
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # ── Environment variables ─────────────────────────────────────────────────
  # Non-sensitive values — set these in the service environment panel.
  # Sensitive values (marked SECRET below) → store in Northflank Secret Groups.
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: SERVER_PORT
      value: "8080"

  # ── Secrets (set via Northflank Secret Groups, NOT plain env vars) ────────
  # Dashboard: Project → Secret Groups → New Secret Group → mount to service
  #
  #   SPRING_DATASOURCE_URL      — jdbc:postgresql://... from Neon console
  #   SPRING_DATASOURCE_USERNAME — from Neon console
  #   SPRING_DATASOURCE_PASSWORD — from Neon console
  #   REDIS_URL                  — rediss://default:...@... from Upstash
  #   JWT_SECRET                 — openssl rand -base64 64
  #   CORS_ALLOWED_ORIGINS       — your Vercel frontend URL, e.g. https://ludo.vercel.app
